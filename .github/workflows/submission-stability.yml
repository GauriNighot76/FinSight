name: submission-stability
on:
  push:
    branches: [stabilize-final-submission, fix-reports-calculations-anomalies]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run final correction calculation regressions
        run: python -m pytest -q tests/test_module5_analytics.py tests/test_module6_health.py tests/test_final_submission_workflow.py
      - name: Run anomaly rerun regression
        run: python -m pytest -q tests/test_workspace_anomalies.py
      - name: Run report consistency regressions
        run: python -m pytest -q tests/test_module7_reports.py tests/test_final_submission_workflow.py
      - name: Run existing scheme regression
        run: python -m pytest -q tests/test_final_submission_workflow.py::test_scheme_engine_invoked_with_real_repository_rules_and_missing_information
      - name: Run ingestion hotfix regressions
        run: >-
          python -m pytest -q
          tests/test_module4_validation.py
          tests/test_csv_normalizer.py
          tests/test_module4_streamlit.py
          tests/test_final_submission_workflow.py::test_realistic_large_csv_over_old_limit_ingests_all_rows
      - name: Run analytics hotfix regressions
        run: python -m pytest -q tests/test_module5_analytics.py tests/test_module5_streamlit.py
      - name: Run navigation regression
        run: python -m pytest -q tests/test_navigation_state.py
      - name: Run report regressions
        run: python -m pytest -q tests/test_module7_reports.py tests/test_final_submission_workflow.py
      - name: Run full regression suite
        run: python -m pytest -q tests
      - name: Compile production modules
        run: >-
          python -m py_compile
          finsight_app/app.py
          finsight_app/business_ui.py
          finsight_app/ingestion_ui.py
          finsight_app/analytics_ui.py
          finsight_app/workspace_ui.py
          finsight_app/schemes_ui.py
          finsight_app/reports_ui.py
          finsight_app/eligibility_engine.py
          finsight_app/scheme_rag.py
          finsight_app/pdf_generator.py
          services/ingestion_service.py
          services/csv_normalizer.py
          services/analytics_service.py
          services/business_health_service.py
          services/decision_support_service.py
          services/report_service.py
          services/business_service.py
          database/db.py
          database/queries.py
      - name: Verify Streamlit starts
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run finsight_app/app.py             --server.headless true             --server.port 8501             --browser.gatherUsageStats false             > /tmp/finsight-streamlit.log 2>&1 &
          pid=$!
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat /tmp/finsight-streamlit.log
            kill "$pid" || true
            exit 1
          fi
          kill "$pid" || true
